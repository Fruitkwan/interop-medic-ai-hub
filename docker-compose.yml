services:
  iris:
    build:
      context: .
      args:
        # Contest target: the AI Hub Early Access build, loaded and retagged locally (see README).
        IMAGE: ${IRIS_IMAGE:-intersystemsdc/iris-community:2026.2-zpm}
    container_name: interop-medic
    # Same start-up on every image: the official AI Hub image already uses /iris-main as its
    # entrypoint, the intersystemsdc image wraps it in a script with a post-start hook we skip.
    # After IRIS is up, apply IRIS_PASSWORD from .env.
    entrypoint: ["/tini", "--", "/iris-main"]
    command:
      - --check-caps
      - "false"
      - --ISCAgent
      - "false"
      - -a
      - iris session IRIS -U USER '##class(Medic.Setup).OnStart()'
    ports:
      # Management Portal: http://localhost:52773/csp/sys/UtilHome.csp (override ports if taken)
      - "${MEDIC_WEB_PORT:-52773}:52773"
      - "${MEDIC_SS_PORT:-1972}:1972"
    volumes:
      - ./data:/data
      - ./dataset:/dataset:ro
    # Every .env variable reaches the container, so any provider's <PROVIDER>_API_KEY and
    # <PROVIDER>_BASE_URL (OPENROUTER_API_KEY, INCEPTION_API_KEY, ...) works without listing it here.
    env_file:
      - path: .env
        required: false
    # Fast tier: the offline mock by default. For Jev or Laya set MEDIC_FAST_PROVIDER=Medic.Provider.SystemOne
    # and SYSTEMONE_BASE_URL (put keys in a git-ignored .env file). See README.
    environment:
      # Password for _SYSTEM, SuperUser and Admin; blank keeps the demo password SYS.
      IRIS_PASSWORD: ${IRIS_PASSWORD:-}
      MEDIC_FAST_PROVIDER: ${MEDIC_FAST_PROVIDER:-}
      # Agent tier: blank = mock; Medic.Provider.AIHubAgent needs the AI Hub image and an LLM key.
      MEDIC_AGENT_PROVIDER: ${MEDIC_AGENT_PROVIDER:-}
      AIHUB_PROVIDER: ${AIHUB_PROVIDER:-}
      AIHUB_MODEL: ${AIHUB_MODEL:-}
      AIHUB_API_KEY: ${AIHUB_API_KEY:-}
      AIHUB_PRICE_IN_PER_MTOK: ${AIHUB_PRICE_IN_PER_MTOK:-}
      AIHUB_PRICE_OUT_PER_MTOK: ${AIHUB_PRICE_OUT_PER_MTOK:-}
      # Agent choices for the web page's model switch: "Label=provider:model,...". An entry is shown
      # only when its key is set below (or in IRIS credentials Medic.<provider>). Blank = AIHUB_* only.
      MEDIC_AGENT_MODELS: ${MEDIC_AGENT_MODELS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SYSTEMONE_BASE_URL: ${SYSTEMONE_BASE_URL:-}
      SYSTEMONE_API_KEY: ${SYSTEMONE_API_KEY:-}
      SYSTEMONE_MODEL: ${SYSTEMONE_MODEL:-}
      SYSTEMONE_PRICE_PER_MTOK: ${SYSTEMONE_PRICE_PER_MTOK:-}
      # Laya base URL for the web page's model switch (fast tier "Laya"); blank hides that choice.
      LAYA_BASE_URL: ${LAYA_BASE_URL:-}
      # Local Ollama for the model switch (fast tier and agent "Ollama"); blank hides those choices.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
      OLLAMA_AGENT_MODEL: ${OLLAMA_AGENT_MODEL:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
    extra_hosts:
      # Lets the container reach a Laya server on the host (Linux; Docker Desktop has this already).
      - "host.docker.internal:host-gateway"
